repos:
  - repo: local
    hooks:
      - id: gofmt
        name: Go formatting check
        entry: bash -c 'output="$(gofmt -l "$@")"; test -z "$output" || { echo "$output"; exit 1; }' --
        language: system
        types: [go]
      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        always_run: true
      - id: go-test
        name: Go tests
        entry: go test ./...
        language: system
        pass_filenames: false
        always_run: true
