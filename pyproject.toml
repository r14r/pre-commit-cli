[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-commit-cli"
version = "0.2.0"
description = "Setup, detect and manage pre-commit hooks for common project environments."
requires-python = ">=3.10"
dependencies = [
  "pre-commit>=4.0.0",
  "pyinstaller>=6.10.0",
  "pyyaml>=6.0.2",
  "shiv>=1.0.6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9",
  "pytest>=8",
  "bandit>=1.8",
  "pre-commit-hooks>=5",
  "pip-audit>=2.8",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project.scripts]
pre-commit-cli = "pre_commit_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
