[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-commit-cli"
version = "2.0.0"
description = "Setup, detect and manage pre-commit hooks for common project environments."
requires-python = ">=3.10"
dependencies = [
  "pre-commit>=4.0.0",
  "pyinstaller>=6.10.0",
  "pyyaml>=6.0.2",
  "shiv>=1.0.6",
]

[project.scripts]
pre-commit-cli = "pre_commit_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
