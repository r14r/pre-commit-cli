schemaVersion: 2
project:
  name: pre-commit-cli
  type: go
  description: Native Go pre-commit configuration and hook manager
defaults:
  failFast: true
  timeout: 10m
requirements:
  commands: [go, git]
workflows:
  setup:
    tasks: [prepare, check, test, build, deploy]
  ci:
    tasks: [prepare, check, test, build]
tasks:
  prepare:
    steps:
      - id: modules
        name: Download Go dependencies
        command:
          exec: go
          args: [mod, download]
      - id: gofmt
        name: Format Go sources
        command:
          exec: gofmt
          args: [-w, main.go, main_test.go]
  check:
    steps:
      - id: format
        name: Check gofmt formatting
        shell: |
          files="$(gofmt -l main.go main_test.go)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - id: vet
        name: Run go vet
        command:
          exec: go
          args: [vet, ./...]
  test:
    steps:
      - id: tests
        name: Run Go tests
        command:
          exec: go
          args: [test, ./...]
  build:
    steps:
      - id: compile
        name: Build Go binary
        shell: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/pre-commit-cli .
  deploy:
    steps:
      - id: install
        name: Install executable
        shell: |
          mkdir -p "${DEPLOY_PATH:-/usr/local/bin}"
          install -m 0755 dist/pre-commit-cli "${DEPLOY_PATH:-/usr/local/bin}/pre-commit-cli"
