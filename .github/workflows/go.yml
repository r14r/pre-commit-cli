name: Go CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: gofmt -w main.go main_test.go
      - run: test -z "$(gofmt -l main.go main_test.go)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o pre-commit-cli .
